<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PEFL Season 16 Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d1a;
  --bg2: #13132a;
  --bg3: #1a1a35;
  --card: #16162e;
  --border: #2a2a50;
  --gold: #f0c040;
  --gold2: #e0a820;
  --purple: #7c5cbf;
  --purple2: #9b7de0;
  --teal: #38c9b0;
  --red: #e05555;
  --green: #4caf7d;
  --text: #e8e8f0;
  --muted: #7878a0;
  --pfc: #5b9cf6;
  --efc: #e07830;
  --division: #f0c040;
  --inter: #9b7de0;
  --intra: #38c9b0;
  --final: #4caf7d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}

/* Background */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%, rgba(124,92,191,0.12) 0%, transparent 60%),radial-gradient(ellipse at 80% 80%, rgba(56,201,176,0.08) 0%, transparent 60%);pointer-events:none;z-index:0;}

.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px;}

/* Header */
header{text-align:center;padding:48px 20px 32px;}
.league-label{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:4px;padding:5px 16px;margin-bottom:20px;text-transform:uppercase;}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,14vw,140px);line-height:.9;color:var(--gold);letter-spacing:4px;text-shadow:0 0 60px rgba(240,192,64,0.3);}
.season-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:6px;color:var(--muted);margin-top:12px;text-transform:uppercase;}
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:32px 0;}

/* Legend */
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-bottom:32px;}
.legend-item{display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:2px;}

/* Standings */
.standings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
@media(max-width:700px){.standings-grid{grid-template-columns:1fr;}}
.standings-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.standings-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.conf-badge{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
.conf-badge.pfc{color:var(--pfc);}
.conf-badge.efc{color:var(--efc);}
.standings-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.standings-table{width:100%;border-collapse:collapse;}
.standings-table td{padding:9px 20px;font-size:14px;border-bottom:1px solid rgba(42,42,80,0.5);}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table .rank{color:var(--muted);font-size:12px;width:24px;}
.standings-table .team-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:1px;}
.standings-table .team-name.playoff{color:var(--gold);}
.standings-table .record{color:var(--muted);text-align:right;}
.standings-table .diff{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;}
.diff.pos{color:var(--green);}
.diff.neg{color:var(--red);}
.div-separator td{background:rgba(124,92,191,0.08);padding:4px 20px;}
.div-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--purple2);}

/* Controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;}
.view-team{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.view-team select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;outline:none;}
.week-filters{display:flex;flex-wrap:wrap;gap:6px;}
.wf-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .2s;}
.wf-btn:hover{border-color:var(--purple);color:var(--purple2);}
.wf-btn.active{background:var(--gold);border-color:var(--gold);color:#0d0d1a;font-weight:700;}

/* Schedule */
.week-block{margin-bottom:40px;}
.week-header{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;}
.week-title{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gold);letter-spacing:2px;}
.week-status{font-size:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;padding:3px 10px;border-radius:20px;text-transform:uppercase;}
.week-status.complete{background:rgba(76,175,125,0.15);color:var(--green);border:1px solid rgba(76,175,125,0.3);}
.week-status.upcoming{background:rgba(120,120,160,0.15);color:var(--muted);border:1px solid rgba(120,120,160,0.2);}
.week-status.live{background:rgba(224,85,85,0.15);color:var(--red);border:1px solid rgba(224,85,85,0.3);}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}

/* Game Card */
.game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.game-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.game-card-top{padding:14px 16px 12px;}
.game-type-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.game-type{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;}
.game-type.division{background:rgba(240,192,64,0.12);color:var(--division);border:1px solid rgba(240,192,64,0.25);}
.game-type.inter{background:rgba(155,125,224,0.12);color:var(--inter);border:1px solid rgba(155,125,224,0.25);}
.game-type.intra{background:rgba(56,201,176,0.12);color:var(--intra);border:1px solid rgba(56,201,176,0.25);}
.game-type.final{background:rgba(76,175,125,0.12);color:var(--final);border:1px solid rgba(76,175,125,0.25);}
.game-result-tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:4px;background:rgba(76,175,125,0.12);color:var(--green);border:1px solid rgba(76,175,125,0.25);}
.game-result-tag.pending{background:rgba(120,120,160,0.1);color:var(--muted);border-color:rgba(120,120,160,0.2);}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team-side{flex:1;min-width:0;}
.team-side.away{text-align:right;}
.team-conf{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.team-conf.pfc{color:var(--pfc);}
.team-conf.efc{color:var(--efc);}
.team-nm{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-nm.winner{color:var(--gold);}
.score-area{text-align:center;min-width:70px;}
.score{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--text);}
.score-vs{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);letter-spacing:2px;}
.game-card-stats{background:var(--bg3);border-top:1px solid var(--border);padding:10px 16px;}
.stats-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.stat-block{flex:1;}
.stat-block.right{text-align:right;}
.stat-line{font-size:11px;color:var(--muted);line-height:1.5;}
.stat-line strong{color:var(--text);font-weight:600;}
.mvp-line{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--gold);text-align:center;}
.mvp-line span{color:var(--muted);}
.no-stats{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);letter-spacing:1px;text-align:center;padding:6px 0;}

/* Trophy icon */
.trophy{font-size:14px;margin-right:3px;}

/* Empty week */
.bye-note{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;padding:16px 0;}

/* Footer */
footer{text-align:center;padding:40px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;border-top:1px solid var(--border);margin-top:20px;}
footer a{color:var(--purple2);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="league-label">Pro Era Football League</div>
  <h1>PEFL</h1>
  <div class="season-label">Season 16 · Official Schedule</div>
</header>
<div class="divider"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--division)"></div>Division Game</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--inter)"></div>Inter-Conference</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--intra)"></div>Intra-Conference</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--final)"></div>Final</div>
</div>

<!-- Standings -->
<div class="standings-grid" id="standingsGrid"></div>

<!-- Controls -->
<div class="controls">
  <div class="view-team">
    <span>View by Team</span>
    <select id="teamFilter" onchange="filterTeam()">
      <option value="all">All Teams</option>
      <optgroup label="PFC – Lebron Division">
        <option value="Ravens">Ravens (PFC)</option>
        <option value="Jags">Jags (PFC)</option>
        <option value="Browns">Browns (PFC)</option>
      </optgroup>
      <optgroup label="PFC – Curry Division">
        <option value="49ers">49ers (PFC)</option>
        <option value="Broncos">Broncos (PFC)</option>
        <option value="Eagles">Eagles (PFC)</option>
      </optgroup>
      <optgroup label="EFC – Wemby Division">
        <option value="Bucs">Bucs (EFC)</option>
        <option value="Texans">Texans (EFC)</option>
        <option value="Raiders">Raiders (EFC)</option>
      </optgroup>
      <optgroup label="EFC – Jordan Division">
        <option value="Commanders">Commanders (EFC)</option>
        <option value="Vikings">Vikings (EFC)</option>
        <option value="Bengals">Bengals (EFC)</option>
      </optgroup>
    </select>
  </div>
  <div class="week-filters" id="weekFilters"></div>
</div>

<!-- Schedule -->
<div id="scheduleContainer"></div>

<footer>PEFL Season 16 &nbsp;·&nbsp; <a href="submit.html">Submit Stats</a> &nbsp;·&nbsp; <a href="admin.html">Admin</a></footer>
</div>

<script>
const TEAMS = {
  Ravens:{conf:"PFC",div:"Lebron"}, Jags:{conf:"PFC",div:"Lebron"}, Browns:{conf:"PFC",div:"Lebron"},
  "49ers":{conf:"PFC",div:"Curry"}, Broncos:{conf:"PFC",div:"Curry"}, Eagles:{conf:"PFC",div:"Curry"},
  Bucs:{conf:"EFC",div:"Wemby"}, Texans:{conf:"EFC",div:"Wemby"}, Raiders:{conf:"EFC",div:"Wemby"},
  Commanders:{conf:"EFC",div:"Jordan"}, Vikings:{conf:"EFC",div:"Jordan"}, Bengals:{conf:"EFC",div:"Jordan"}
};

const SCHEDULE = [
  {week:1,games:[
    {home:"Eagles",away:"Bengals",type:"inter"},
    {home:"Jags",away:"Commanders",type:"inter"},
    {home:"Ravens",away:"Broncos",type:"intra"},
    {home:"49ers",away:"Bucs",type:"inter"},
    {home:"Texans",away:"Raiders",type:"division"},
    {home:"Browns",away:"Vikings",type:"inter"}
  ]},
  {week:2,games:[
    {home:"Jags",away:"Eagles",type:"intra"},
    {home:"Broncos",away:"49ers",type:"division"},
    {home:"Bucs",away:"Commanders",type:"intra"},
    {home:"Browns",away:"Bengals",type:"inter"},
    {home:"Ravens",away:"Raiders",type:"inter"},
    {home:"Texans",away:"Vikings",type:"intra"}
  ]},
  {week:3,games:[
    {home:"Jags",away:"Texans",type:"inter"},
    {home:"Browns",away:"Broncos",type:"intra"},
    {home:"Eagles",away:"49ers",type:"division"},
    {home:"Commanders",away:"Bengals",type:"division"},
    {home:"Ravens",away:"Bucs",type:"inter"},
    {home:"Raiders",away:"Vikings",type:"intra"}
  ]},
  {week:4,games:[
    {home:"Jags",away:"Vikings",type:"inter"},
    {home:"Browns",away:"49ers",type:"intra"},
    {home:"Ravens",away:"Commanders",type:"inter"},
    {home:"Broncos",away:"Bucs",type:"inter"},
    {home:"Eagles",away:"Texans",type:"inter"},
    {home:"Raiders",away:"Bengals",type:"intra"}
  ]},
  {week:5,games:[
    {home:"Commanders",away:"Vikings",type:"division"},
    {home:"Eagles",away:"Broncos",type:"division"},
    {home:"Ravens",away:"49ers",type:"intra"},
    {home:"Jags",away:"Browns",type:"division"},
    {home:"Raiders",away:"Texans",type:"division"},
    {home:"Bucs",away:"Bengals",type:"intra"}
  ]},
  {week:6,games:[
    {home:"Bengals",away:"Vikings",type:"division"},
    {home:"Raiders",away:"Commanders",type:"intra"},
    {home:"Broncos",away:"Eagles",type:"division"},
    {home:"Ravens",away:"Jags",type:"division"},
    {home:"Bucs",away:"Texans",type:"division"}
  ]},
  {week:7,games:[
    {home:"Vikings",away:"Commanders",type:"division"},
    {home:"Jags",away:"Broncos",type:"intra"},
    {home:"49ers",away:"Bengals",type:"inter"},
    {home:"Ravens",away:"Eagles",type:"intra"},
    {home:"Browns",away:"Raiders",type:"inter"},
    {home:"Texans",away:"Bucs",type:"division"}
  ]},
  {week:8,games:[
    {home:"Vikings",away:"Bengals",type:"division"},
    {home:"Browns",away:"Commanders",type:"inter"},
    {home:"Eagles",away:"Bucs",type:"inter"},
    {home:"Broncos",away:"Texans",type:"inter"},
    {home:"Jags",away:"Ravens",type:"division"}
  ]},
  {week:9,games:[
    {home:"Broncos",away:"Vikings",type:"inter"},
    {home:"Texans",away:"Commanders",type:"intra"},
    {home:"Browns",away:"Eagles",type:"intra"},
    {home:"Jags",away:"49ers",type:"intra"},
    {home:"Raiders",away:"Bucs",type:"division"}
  ]},
  {week:10,games:[
    {home:"Bengals",away:"Commanders",type:"division"},
    {home:"49ers",away:"Vikings",type:"inter"},
    {home:"Ravens",away:"Browns",type:"division"},
    {home:"Jags",away:"Raiders",type:"inter"}
  ]},
  {week:11,games:[
    {home:"Texans",away:"Bengals",type:"intra"},
    {home:"49ers",away:"Commanders",type:"inter"},
    {home:"Browns",away:"Jags",type:"division"},
    {home:"Bucs",away:"Vikings",type:"intra"},
    {home:"Eagles",away:"Raiders",type:"inter"}
  ]},
  {week:12,games:[
    {home:"Broncos",away:"Bengals",type:"inter"},
    {home:"Ravens",away:"Texans",type:"inter"},
    {home:"49ers",away:"Eagles",type:"division"},
    {home:"Bucs",away:"Raiders",type:"division"}
  ]},
  {week:13,games:[
    {home:"49ers",away:"Broncos",type:"division"},
    {home:"Browns",away:"Ravens",type:"division"}
  ]}
];

// Storage key
const STORAGE_KEY = "pefl_s16_stats";

function getStats(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch(e){ return []; }
}

function getApprovedStats(){
  return getStats().filter(s=>s.status==="approved");
}

// Compute standings
function computeStandings(){
  const stats = getApprovedStats();
  const records = {};
  Object.keys(TEAMS).forEach(t=>{records[t]={w:0,l:0,pts_for:0,pts_against:0};});

  // Build game results from approved stats
  const gameResults = {};
  stats.forEach(s=>{
    const key = `${s.week}_${s.home}_${s.away}`;
    if(!gameResults[key]) gameResults[key]={home:s.home,away:s.away,week:s.week,homeScore:0,awayScore:0};
    if(s.team===s.home) gameResults[key].homeScore=parseInt(s.score)||0;
    if(s.team===s.away) gameResults[key].awayScore=parseInt(s.score)||0;
  });

  return records;
}

function buildStandings(){
  const pfcDiv1 = ["Ravens","Jags","Browns"];
  const pfcDiv2 = ["49ers","Broncos","Eagles"];
  const efcDiv1 = ["Bucs","Texans","Raiders"];
  const efcDiv2 = ["Commanders","Vikings","Bengals"];

  // Get game results
  const stats = getApprovedStats();
  const records = {};
  Object.keys(TEAMS).forEach(t=>{records[t]={w:0,l:0,diff:0};});

  // Group stats by game
  const games = {};
  stats.forEach(s=>{
    if(!s.score) return;
    const key = `w${s.week}_${[s.home,s.away].sort().join('_')}`;
    if(!games[key]) games[key]={home:s.home,away:s.away,scores:{}};
    games[key].scores[s.team]=parseInt(s.score)||0;
  });

  Object.values(games).forEach(g=>{
    const hs = g.scores[g.home]??null;
    const as = g.scores[g.away]??null;
    if(hs===null||as===null) return;
    if(hs>as){
      records[g.home].w++; records[g.away].l++;
    } else if(as>hs){
      records[g.away].w++; records[g.home].l++;
    }
    records[g.home].diff += hs-as;
    records[g.away].diff += as-hs;
  });

  function renderConf(conf, div1, div2, div1name, div2name){
    const allTeams = [...div1,...div2];
    allTeams.sort((a,b)=>{
      const ra=records[a], rb=records[b];
      const wa=ra.w/(ra.w+ra.l||1), wb=rb.w/(rb.w+rb.l||1);
      if(wb!==wa) return wb-wa;
      return rb.diff-ra.diff;
    });
    let html=`<div class="standings-card"><div class="standings-head"><span class="conf-badge ${conf.toLowerCase()}">${conf}</span><span class="standings-title">Standings</span></div><table class="standings-table">`;
    html+=`<tr class="div-separator"><td colspan="4"><span class="div-label">${div1name} Division</span></td></tr>`;
    div1.forEach((t,i)=>{
      const r=records[t];
      const diffStr=r.diff>0?'+'+r.diff:r.diff;
      const diffCls=r.diff>0?'pos':r.diff<0?'neg':'';
      const playoff=r.w>r.l?'playoff':'';
      html+=`<tr><td class="rank">${i+1}</td><td class="team-name ${playoff}">${playoff?'+ ':''}${t}</td><td class="record">${r.w}-${r.l}</td><td class="diff ${diffCls}">${r.diff===0?'—':diffStr}</td></tr>`;
    });
    html+=`<tr class="div-separator"><td colspan="4"><span class="div-label">${div2name} Division</span></td></tr>`;
    div2.forEach((t,i)=>{
      const r=records[t];
      const diffStr=r.diff>0?'+'+r.diff:r.diff;
      const diffCls=r.diff>0?'pos':r.diff<0?'neg':'';
      const playoff=r.w>r.l?'playoff':'';
      html+=`<tr><td class="rank">${i+1}</td><td class="team-name ${playoff}">${playoff?'+ ':''}${t}</td><td class="record">${r.w}-${r.l}</td><td class="diff ${diffCls}">${r.diff===0?'—':diffStr}</td></tr>`;
    });
    html+='</table></div>';
    return html;
  }

  document.getElementById('standingsGrid').innerHTML=
    renderConf('PFC',pfcDiv1,pfcDiv2,'Lebron','Curry')+
    renderConf('EFC',efcDiv1,efcDiv2,'Wemby','Jordan');
}

function buildWeekFilters(){
  const container=document.getElementById('weekFilters');
  let html=`<button class="wf-btn active" data-week="all" onclick="filterWeek('all',this)">All Weeks</button>`;
  for(let w=1;w<=13;w++) html+=`<button class="wf-btn" data-week="${w}" onclick="filterWeek(${w},this)">Wk ${w}</button>`;
  container.innerHTML=html;
}

function filterWeek(week,btn){
  document.querySelectorAll('.wf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.week-block').forEach(b=>{
    b.style.display=(week==='all'||b.dataset.week==week)?'':'none';
  });
}

function filterTeam(){
  const team=document.getElementById('teamFilter').value;
  document.querySelectorAll('.game-card').forEach(c=>{
    c.style.display=(team==='all'||c.dataset.home===team||c.dataset.away===team)?'':'none';
  });
  document.querySelectorAll('.week-block').forEach(b=>{
    const visible=[...b.querySelectorAll('.game-card')].some(c=>c.style.display!=='none');
    b.style.display=visible?'':'none';
  });
}

function buildSchedule(){
  const approvedStats = getApprovedStats();
  const statMap={};
  approvedStats.forEach(s=>{
    const key=`w${s.week}_${[s.home,s.away].sort().join('_')}`;
    if(!statMap[key]) statMap[key]=[];
    statMap[key].push(s);
  });

  let html='';
  SCHEDULE.forEach(wk=>{
    const hasGames = wk.games.length>0;
    html+=`<div class="week-block" data-week="${wk.week}">`;
    html+=`<div class="week-header"><span class="week-title">WEEK ${wk.week}</span></div>`;
    if(!hasGames){
      html+=`<div class="bye-note">No games scheduled this week.</div>`;
    } else {
      html+=`<div class="games-grid">`;
      wk.games.forEach(g=>{
        const key=`w${wk.week}_${[g.home,g.away].sort().join('_')}`;
        const gameStats=statMap[key]||[];
        const homeStat=gameStats.find(s=>s.team===g.home);
        const awayStat=gameStats.find(s=>s.team===g.away);
        const homeScore=homeStat?.score??null;
        const awayScore=awayStat?.score??null;
        const hasScore=homeScore!==null&&awayScore!==null;
        const homeWin=hasScore&&parseInt(homeScore)>parseInt(awayScore);
        const awayWin=hasScore&&parseInt(awayScore)>parseInt(homeScore);
        const homeCls=TEAMS[g.home]?.conf.toLowerCase()||'pfc';
        const awayCls=TEAMS[g.away]?.conf.toLowerCase()||'efc';

        html+=`<div class="game-card" data-home="${g.home}" data-away="${g.away}">`;
        html+=`<div class="game-card-top">`;
        html+=`<div class="game-type-bar"><span class="game-type ${g.type}">${g.type==='inter'?'Inter-Conference':g.type==='intra'?'Intra-Conference':g.type==='division'?'Division Game':'Final'}</span>`;
        html+=hasScore?`<span class="game-result-tag">Final</span>`:`<span class="game-result-tag pending">Upcoming</span>`;
        html+=`</div>`;
        html+=`<div class="matchup">`;
        html+=`<div class="team-side home"><div class="team-conf ${homeCls}">${TEAMS[g.home]?.conf||''}</div><div class="team-nm ${homeWin?'winner':''}">${homeWin?'🏆 ':''}${g.home}</div></div>`;
        html+=`<div class="score-area">${hasScore?`<div class="score">${homeScore}-${awayScore}</div>`:`<div class="score-vs">VS</div>`}</div>`;
        html+=`<div class="team-side away"><div class="team-conf ${awayCls}">${TEAMS[g.away]?.conf||''}</div><div class="team-nm ${awayWin?'winner':''}">${g.away}${awayWin?' 🏆':''}</div></div>`;
        html+=`</div></div>`;

        // Stats section
        html+=`<div class="game-card-stats">`;
        if(gameStats.length>0){
          html+=`<div class="stats-row">`;
          html+=`<div class="stat-block">`;
          if(homeStat){
            if(homeStat.pass_yds||homeStat.pass_tds) html+=`<div class="stat-line"><strong>${homeStat.player_name||g.home}</strong></div>`;
            if(homeStat.pass_tds) html+=`<div class="stat-line">Pass TDs: <strong>${homeStat.pass_tds}</strong>${homeStat.ints_thrown?` · INTs: <strong>${homeStat.ints_thrown}</strong>`:''}</div>`;
            if(homeStat.rush_tds) html+=`<div class="stat-line">Rush TDs: <strong>${homeStat.rush_tds}</strong></div>`;
            if(homeStat.rec_tds) html+=`<div class="stat-line">Rec TDs: <strong>${homeStat.rec_tds}</strong></div>`;
          }
          html+=`</div>`;
          html+=`<div class="stat-block right">`;
          if(awayStat){
            if(awayStat.pass_tds||awayStat.rush_tds) html+=`<div class="stat-line"><strong>${awayStat.player_name||g.away}</strong></div>`;
            if(awayStat.pass_tds) html+=`<div class="stat-line">Pass TDs: <strong>${awayStat.pass_tds}</strong>${awayStat.ints_thrown?` · INTs: <strong>${awayStat.ints_thrown}</strong>`:''}</div>`;
            if(awayStat.rush_tds) html+=`<div class="stat-line">Rush TDs: <strong>${awayStat.rush_tds}</strong></div>`;
            if(awayStat.rec_tds) html+=`<div class="stat-line">Rec TDs: <strong>${awayStat.rec_tds}</strong></div>`;
          }
          html+=`</div></div>`;
          // MVP
          const mvp=gameStats.find(s=>s.mvp_name);
          if(mvp) html+=`<div class="mvp-line">⭐ <span>MVP:</span> ${mvp.mvp_name} — ${mvp.mvp_note||''}</div>`;
        } else {
          html+=`<div class="no-stats">Stats pending</div>`;
        }
        html+=`</div></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  document.getElementById('scheduleContainer').innerHTML=html;
}

function init(){
  buildStandings();
  buildWeekFilters();
  buildSchedule();
}
init();
</script>
</body>
</html>
