<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PEFL Season 16 Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a35;--card:#16162e;--border:#2a2a50;--gold:#f0c040;--purple2:#9b7de0;--teal:#38c9b0;--red:#e05555;--green:#4caf7d;--text:#e8e8f0;--muted:#7878a0;--pfc:#5b9cf6;--efc:#e07830;--division:#f0c040;--inter:#9b7de0;--intra:#38c9b0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(124,92,191,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(56,201,176,.08) 0%,transparent 60%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px;}
header{text-align:center;padding:48px 20px 32px;}
.league-label{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:4px;padding:5px 16px;margin-bottom:20px;text-transform:uppercase;}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,14vw,140px);line-height:.9;color:var(--gold);letter-spacing:4px;text-shadow:0 0 60px rgba(240,192,64,.3);}
.season-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:6px;color:var(--muted);margin-top:12px;text-transform:uppercase;}
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:32px 0;}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-bottom:32px;}
.legend-item{display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:2px;}
.standings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
@media(max-width:700px){.standings-grid{grid-template-columns:1fr;}}
.standings-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.standings-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);}
.conf-badge{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
.conf-badge.pfc{color:var(--pfc);}
.conf-badge.efc{color:var(--efc);}
.standings-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.standings-table{width:100%;border-collapse:collapse;}
.standings-table td{padding:9px 20px;font-size:14px;border-bottom:1px solid rgba(42,42,80,.5);}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table .rank{color:var(--muted);font-size:12px;width:24px;}
.standings-table .tname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:1px;}
.standings-table .tname.playoff{color:var(--gold);}
.standings-table .record{color:var(--muted);text-align:right;}
.standings-table .diff{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;}
.diff.pos{color:var(--green);}
.diff.neg{color:var(--red);}
.div-sep td{background:rgba(124,92,191,.08);padding:4px 20px;}
.div-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--purple2);}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;}
.view-team{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.view-team select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;outline:none;}
.week-filters{display:flex;flex-wrap:wrap;gap:6px;}
.wf-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .2s;}
.wf-btn:hover{border-color:var(--purple2);color:var(--purple2);}
.wf-btn.active{background:var(--gold);border-color:var(--gold);color:#0d0d1a;font-weight:700;}
.week-block{margin-bottom:40px;}
.week-header{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;}
.week-title{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gold);letter-spacing:2px;}
.week-date{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);letter-spacing:2px;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.game-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.game-card-top{padding:14px 16px 12px;}
.game-type-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.game-type{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;}
.game-type.division{background:rgba(240,192,64,.12);color:var(--division);border:1px solid rgba(240,192,64,.25);}
.game-type.inter{background:rgba(155,125,224,.12);color:var(--inter);border:1px solid rgba(155,125,224,.25);}
.game-type.intra{background:rgba(56,201,176,.12);color:var(--intra);border:1px solid rgba(56,201,176,.25);}
.game-result-tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:4px;}
.game-result-tag.final{background:rgba(76,175,125,.12);color:var(--green);border:1px solid rgba(76,175,125,.3);}
.game-result-tag.upcoming{background:rgba(120,120,160,.1);color:var(--muted);border-color:rgba(120,120,160,.2);}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team-side{flex:1;min-width:0;}
.team-side.away{text-align:right;}
.team-conf{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.team-conf.pfc{color:var(--pfc);}
.team-conf.efc{color:var(--efc);}
.team-nm{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;line-height:1;}
.team-nm.winner{color:var(--gold);}
.score-area{text-align:center;min-width:70px;}
.score{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
.score-vs{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);letter-spacing:2px;}
.game-card-stats{background:var(--bg3);border-top:1px solid var(--border);padding:10px 16px;}
.stats-row{display:flex;justify-content:space-between;gap:8px;}
.stat-block{flex:1;}
.stat-block.right{text-align:right;}
.stat-line{font-size:11px;color:var(--muted);line-height:1.6;}
.stat-line strong{color:var(--text);}
.no-stats{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);letter-spacing:1px;text-align:center;padding:6px 0;}
footer{text-align:center;padding:40px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;border-top:1px solid var(--border);margin-top:20px;}
footer a{color:var(--purple2);text-decoration:none;margin:0 8px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="league-label">Pro Era Football League</div>
  <h1>PEFL</h1>
  <div class="season-label">Season 16 · Official Schedule</div>
</header>
<div class="divider"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--division)"></div>Division Game</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--inter)"></div>Inter-Conference</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--intra)"></div>Intra-Conference</div>
</div>
<div class="standings-grid" id="standingsGrid"></div>
<div class="controls">
  <div class="view-team">
    View:<select id="teamFilter" onchange="filterTeam()">
      <option value="all">All Teams</option>
      <optgroup label="PFC – Lebron"><option value="Ravens">Ravens</option><option value="Jags">Jags</option><option value="Browns">Browns</option></optgroup>
      <optgroup label="PFC – Curry"><option value="49ers">49ers</option><option value="Broncos">Broncos</option><option value="Eagles">Eagles</option></optgroup>
      <optgroup label="EFC – Wemby"><option value="Bucs">Bucs</option><option value="Texans">Texans</option><option value="Raiders">Raiders</option></optgroup>
      <optgroup label="EFC – Jordan"><option value="Commanders">Commanders</option><option value="Vikings">Vikings</option><option value="Bengals">Bengals</option></optgroup>
    </select>
  </div>
  <div class="week-filters" id="weekFilters"></div>
</div>
<div id="scheduleContainer"></div>
<footer><a href="submit.html">Submit Stats</a> · <a href="stats.html">Leaderboard</a> · <a href="admin.html">Admin</a></footer>
</div>
<script>
var DB='https://pefl-cefl-default-rtdb.firebaseio.com';
var TEAMS={Ravens:{conf:"PFC",div:"Lebron"},Jags:{conf:"PFC",div:"Lebron"},Browns:{conf:"PFC",div:"Lebron"},"49ers":{conf:"PFC",div:"Curry"},Broncos:{conf:"PFC",div:"Curry"},Eagles:{conf:"PFC",div:"Curry"},Bucs:{conf:"EFC",div:"Wemby"},Texans:{conf:"EFC",div:"Wemby"},Raiders:{conf:"EFC",div:"Wemby"},Commanders:{conf:"EFC",div:"Jordan"},Vikings:{conf:"EFC",div:"Jordan"},Bengals:{conf:"EFC",div:"Jordan"}};
var WEEK_DATES=["June 5 - June 7","June 8 - June 10","June 11 - June 13","June 14 - June 16","June 17 - June 19","June 20 - June 22","June 23 - June 25","June 26 - June 28","June 29 - July 1","July 2 - July 4","July 5 - July 7","July 8 - July 10","July 11 - July 13"];
var SCHEDULE=[
  {week:1,games:[{home:"Ravens",away:"Jags",type:"division"},{home:"Bengals",away:"Browns",type:"inter"},{home:"Vikings",away:"49ers",type:"inter"},{home:"Commanders",away:"Broncos",type:"inter"},{home:"Raiders",away:"Eagles",type:"inter"},{home:"Texans",away:"Bucs",type:"division"}]},
  {week:2,games:[{home:"Ravens",away:"Browns",type:"division"},{home:"Jags",away:"49ers",type:"intra"},{home:"Bengals",away:"Broncos",type:"inter"},{home:"Vikings",away:"Eagles",type:"inter"},{home:"Commanders",away:"Bucs",type:"intra"},{home:"Raiders",away:"Texans",type:"division"}]},
  {week:3,games:[{home:"Ravens",away:"49ers",type:"intra"},{home:"Browns",away:"Broncos",type:"intra"},{home:"Jags",away:"Eagles",type:"intra"},{home:"Bengals",away:"Bucs",type:"intra"},{home:"Vikings",away:"Texans",type:"intra"},{home:"Commanders",away:"Raiders",type:"intra"}]},
  {week:4,games:[{home:"Ravens",away:"Broncos",type:"intra"},{home:"49ers",away:"Eagles",type:"division"},{home:"Browns",away:"Bucs",type:"inter"},{home:"Jags",away:"Texans",type:"inter"},{home:"Bengals",away:"Raiders",type:"intra"},{home:"Vikings",away:"Commanders",type:"division"}]},
  {week:5,games:[{home:"Ravens",away:"Eagles",type:"intra"},{home:"Broncos",away:"Bucs",type:"inter"},{home:"49ers",away:"Texans",type:"inter"},{home:"Browns",away:"Raiders",type:"inter"},{home:"Jags",away:"Commanders",type:"inter"},{home:"Bengals",away:"Vikings",type:"division"}]},
  {week:6,games:[{home:"Ravens",away:"Bucs",type:"inter"},{home:"Eagles",away:"Texans",type:"inter"},{home:"Broncos",away:"Raiders",type:"inter"},{home:"49ers",away:"Commanders",type:"inter"},{home:"Browns",away:"Vikings",type:"inter"},{home:"Jags",away:"Bengals",type:"inter"}]},
  {week:7,games:[{home:"Ravens",away:"Texans",type:"inter"},{home:"Bucs",away:"Raiders",type:"division"},{home:"Eagles",away:"Commanders",type:"inter"},{home:"Broncos",away:"Vikings",type:"inter"},{home:"49ers",away:"Bengals",type:"inter"},{home:"Browns",away:"Jags",type:"division"}]},
  {week:8,games:[{home:"Ravens",away:"Raiders",type:"inter"},{home:"Texans",away:"Commanders",type:"intra"},{home:"Bucs",away:"Vikings",type:"intra"},{home:"Eagles",away:"Bengals",type:"inter"},{home:"Broncos",away:"Jags",type:"intra"},{home:"49ers",away:"Browns",type:"intra"}]},
  {week:9,games:[{home:"Ravens",away:"Commanders",type:"inter"},{home:"Raiders",away:"Vikings",type:"intra"},{home:"Texans",away:"Bengals",type:"intra"},{home:"Bucs",away:"Jags",type:"inter"},{home:"Eagles",away:"Browns",type:"intra"},{home:"Broncos",away:"49ers",type:"division"}]},
  {week:10,games:[{home:"Ravens",away:"Vikings",type:"inter"},{home:"Commanders",away:"Bengals",type:"division"},{home:"Raiders",away:"Jags",type:"inter"},{home:"Texans",away:"Browns",type:"inter"},{home:"Bucs",away:"49ers",type:"inter"},{home:"Eagles",away:"Broncos",type:"division"}]},
  {week:11,games:[{home:"Ravens",away:"Bengals",type:"inter"},{home:"Vikings",away:"Jags",type:"inter"},{home:"Commanders",away:"Browns",type:"inter"},{home:"Raiders",away:"49ers",type:"inter"},{home:"Texans",away:"Broncos",type:"inter"},{home:"Bucs",away:"Eagles",type:"inter"}]},
  {week:12,games:[{home:"Bucs",away:"Texans",type:"division"},{home:"49ers",away:"Eagles",type:"division"},{home:"Jags",away:"Browns",type:"division"},{home:"Vikings",away:"Commanders",type:"division"},{home:"Ravens",away:"Jags",type:"division"},{home:"Raiders",away:"Bucs",type:"division"}]},
  {week:13,games:[{home:"Browns",away:"Ravens",type:"division"},{home:"Eagles",away:"Broncos",type:"division"},{home:"Bengals",away:"Vikings",type:"division"},{home:"Texans",away:"Raiders",type:"division"},{home:"49ers",away:"Broncos",type:"division"},{home:"Bengals",away:"Commanders",type:"division"}]},
];

var _stats=[];
var _scores={};

function getApproved(){return _stats.filter(function(s){return s.league==='pefl'&&s.status==='approved';});}

var _stats=[];
var _scores={};
function getScores(){return _scores;}
async function fetchAndRender(){
  try{
    var r=await fetch(DB+'/stats.json');
    var j=await r.json();
    _stats=j?Object.values(j):[];
  }catch(e){_stats=[];}
  try{
    var r2=await fetch(DB+'/pefl_scores.json');
    var j2=await r2.json();
    _scores=j2||{};
  }catch(e){_scores={};}
  buildStandings();
  buildSchedule();
}

function buildStandings(){
  var approved=getApproved();
  var records={};
  Object.keys(TEAMS).forEach(function(t){records[t]={w:0,l:0,diff:0};});
  var games={};
  approved.forEach(function(s){
    if(!s.score) return;
    var key='w'+s.week+'_'+[s.home,s.away].sort().join('_');
    if(!games[key]) games[key]={home:s.home,away:s.away,scores:{}};
    if(!games[key].scores[s.team]) games[key].scores[s.team]=parseInt(s.score)||0;
  });
  // also check admin scores
  Object.keys(_scores).forEach(function(key){
    var sc=_scores[key];
    if(sc.home===''||sc.away==='') return;
    if(!games[key]){
      // parse key: w1_Home_Away
      var parts=key.split('_');
      var week=parseInt(parts[0].replace('w',''));
      var teams=[parts[1],parts[2]];
      games[key]={home:teams[0],away:teams[1],scores:{}};
    }
    games[key].adminHome=sc.home;
    games[key].adminAway=sc.away;
  });
  Object.values(games).forEach(function(g){
    var hs=g.adminHome!==undefined?g.adminHome:(g.scores[g.home]??null);
    var as=g.adminAway!==undefined?g.adminAway:(g.scores[g.away]??null);
    if(hs===null||as===null) return;
    hs=parseInt(hs); as=parseInt(as);
    if(hs>as){records[g.home].w++;records[g.away].l++;}
    else if(as>hs){records[g.away].w++;records[g.home].l++;}
    records[g.home].diff+=hs-as;
    records[g.away].diff+=as-hs;
  });
  function divHTML(teams,dname){
    var sorted=teams.slice().sort(function(a,b){
      var ra=records[a],rb=records[b];
      var ga=ra.w+ra.l,gb=rb.w+rb.l;
      var wa=ga?ra.w/ga:0,wb=gb?rb.w/gb:0;
      return wb-wa||rb.diff-ra.diff;
    });
    return '<tr class="div-sep"><td colspan="4"><span class="div-label">'+dname+' Division</span></td></tr>'+
      sorted.map(function(t,i){
        var r=records[t],d=r.diff,pl=r.w>r.l?'playoff':'';
        return '<tr><td class="rank">'+(i+1)+'</td><td class="tname '+pl+'">'+(pl?'+ ':'')+t+'</td><td class="record">'+r.w+'-'+r.l+'</td><td class="diff '+(d>0?'pos':d<0?'neg':'')+'">'+(d===0?'—':d>0?'+'+d:d)+'</td></tr>';
      }).join('');
  }
  function confHTML(conf,div1,div2,d1n,d2n){
    return '<div class="standings-card"><div class="standings-head"><span class="conf-badge '+conf.toLowerCase()+'">'+conf+'</span><span class="standings-title">Standings</span></div>'
      +'<table class="standings-table">'+divHTML(div1,d1n)+divHTML(div2,d2n)+'</table></div>';
  }
  document.getElementById('standingsGrid').innerHTML=
    confHTML('PFC',['Ravens','Jags','Browns'],['49ers','Broncos','Eagles'],'Lebron','Curry')+
    confHTML('EFC',['Bucs','Texans','Raiders'],['Commanders','Vikings','Bengals'],'Wemby','Jordan');
}

function buildWeekFilters(){
  var h='<button class="wf-btn active" onclick="filterWeek(\'all\',this)">All Weeks</button>';
  for(var w=1;w<=13;w++) h+='<button class="wf-btn" onclick="filterWeek('+w+',this)">Wk '+w+'</button>';
  document.getElementById('weekFilters').innerHTML=h;
}

function filterWeek(w,btn){
  document.querySelectorAll('.wf-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.week-block').forEach(function(b){b.style.display=(w==='all'||b.dataset.week==w)?'':'none';});
}

function filterTeam(){
  var t=document.getElementById('teamFilter').value;
  document.querySelectorAll('.game-card').forEach(function(c){c.style.display=(t==='all'||c.dataset.home===t||c.dataset.away===t)?'':'none';});
  document.querySelectorAll('.week-block').forEach(function(b){
    var vis=[].some.call(b.querySelectorAll('.game-card'),function(c){return c.style.display!=='none';});
    b.style.display=vis?'':'none';
  });
}

function buildSchedule(){
  var approved=getApproved();
  var statMap={};
  approved.forEach(function(s){
    var key='w'+s.week+'_'+[s.home,s.away].sort().join('_');
    if(!statMap[key]) statMap[key]=[];
    statMap[key].push(s);
  });
  var html='';
  SCHEDULE.forEach(function(wk){
    html+='<div class="week-block" data-week="'+wk.week+'"><div class="week-header"><span class="week-title">WEEK '+wk.week+'</span><span class="week-date">'+WEEK_DATES[wk.week-1]+'</span></div><div class="games-grid">';
    wk.games.forEach(function(g){
      var key='w'+wk.week+'_'+[g.home,g.away].sort().join('_');
      var gStats=statMap[key]||[];
      var homeStat=gStats.filter(function(s){return s.team===g.home;}).slice(-1)[0];
      var awayStat=gStats.filter(function(s){return s.team===g.away;}).slice(-1)[0];
      var sc=_scores[key]||{};
      var hs=sc.home!==undefined&&sc.home!==''?sc.home:(homeStat&&homeStat.score?homeStat.score:null);
      var as=sc.away!==undefined&&sc.away!==''?sc.away:(awayStat&&awayStat.score?awayStat.score:null);
      var hasScore=hs!==null&&as!==null&&hs!==''&&as!=='';
      var homeWin=hasScore&&parseInt(hs)>parseInt(as);
      var awayWin=hasScore&&parseInt(as)>parseInt(hs);
      var hc=(TEAMS[g.home]&&TEAMS[g.home].conf.toLowerCase())||'pfc';
      var ac=(TEAMS[g.away]&&TEAMS[g.away].conf.toLowerCase())||'efc';
      var typeLabel=g.type==='inter'?'Inter-Conference':g.type==='intra'?'Intra-Conference':'Division Game';
      html+='<div class="game-card" data-home="'+g.home+'" data-away="'+g.away+'">'
        +'<div class="game-card-top"><div class="game-type-bar"><span class="game-type '+g.type+'">'+typeLabel+'</span>'
        +(hasScore?'<span class="game-result-tag final">Final</span>':'<span class="game-result-tag upcoming">Upcoming</span>')
        +'</div><div class="matchup">'
        +'<div class="team-side home"><div class="team-conf '+hc+'">'+(TEAMS[g.home]?TEAMS[g.home].conf:'')+'</div><div class="team-nm '+(homeWin?'winner':'')+'">'+( homeWin?'🏆 ':'')+g.home+'</div></div>'
        +'<div class="score-area">'+(hasScore?'<div class="score">'+hs+'-'+as+'</div>':'<div class="score-vs">VS</div>')+'</div>'
        +'<div class="team-side away"><div class="team-conf '+ac+'">'+(TEAMS[g.away]?TEAMS[g.away].conf:'')+'</div><div class="team-nm '+(awayWin?'winner':'')+'">'+g.away+(awayWin?' 🏆':'')+'</div></div>'
        +'</div></div>'
        +'<div class="game-card-stats">';
      if(gStats.length>0){
        html+='<div class="stats-row"><div class="stat-block">';
        if(homeStat){
          html+='<div class="stat-line"><strong>'+(homeStat.player_name||g.home)+'</strong></div>';
          if(homeStat.pass_tds) html+='<div class="stat-line">Pass TDs: <strong>'+homeStat.pass_tds+'</strong>'+(homeStat.ints_thrown?' · INTs: <strong>'+homeStat.ints_thrown+'</strong>':'')+'</div>';
          if(homeStat.rush_tds) html+='<div class="stat-line">Rush TDs: <strong>'+homeStat.rush_tds+'</strong></div>';
        }
        html+='</div><div class="stat-block right">';
        if(awayStat){
          html+='<div class="stat-line"><strong>'+(awayStat.player_name||g.away)+'</strong></div>';
          if(awayStat.pass_tds) html+='<div class="stat-line">Pass TDs: <strong>'+awayStat.pass_tds+'</strong>'+(awayStat.ints_thrown?' · INTs: <strong>'+awayStat.ints_thrown+'</strong>':'')+'</div>';
          if(awayStat.rush_tds) html+='<div class="stat-line">Rush TDs: <strong>'+awayStat.rush_tds+'</strong></div>';
        }
        html+='</div></div>';
      } else {
        html+='<div class="no-stats">Stats pending</div>';
      }
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('scheduleContainer').innerHTML=html;
}

buildWeekFilters();
fetchAndRender();
</script>
</body>
</html>
