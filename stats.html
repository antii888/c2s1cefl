<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CEFL C2S1 · Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--bg2:#0f0f0f;--bg3:#141414;--card:#0d0d0d;--crimson:#8b0000;--gold:#c9a84c;--gold2:#ffd700;--warm:#f5f0e0;--muted:#7a7060;--border:#2a1a1a;--border2:#3a2a2a;--green:#4caf7d;--red:#e05555;--blue:#4a9eff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--warm);font-family:'Barlow',sans-serif;min-height:100vh;padding:0 0 60px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center top,rgba(139,0,0,.08) 0%,transparent 60%);pointer-events:none;}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}
.page-header{padding:40px 0 28px;border-bottom:1px solid var(--border2);margin-bottom:28px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;margin-bottom:16px;}
.back-link:hover{color:var(--gold);}
.page-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.page-title{font-family:'Playfair Display',serif;font-size:48px;font-style:italic;font-weight:900;line-height:1;}
.page-sub{color:var(--muted);font-size:14px;margin-top:8px;}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;align-items:center;}
.ctrl-select{background:var(--bg2);border:1px solid var(--border2);color:var(--warm);font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:8px 14px;border-radius:2px;cursor:pointer;outline:none;}
.ctrl-select:focus{border-color:var(--gold);}
.ctrl-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.category-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.ctab{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:7px 14px;border-radius:2px;cursor:pointer;transition:all .2s;}
.ctab:hover{border-color:var(--gold);color:var(--gold);}
.ctab.active{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700;}
.leaderboard{background:var(--card);border:1px solid var(--border2);border-radius:4px;overflow:hidden;margin-bottom:24px;}
.lb-head{padding:14px 20px;border-bottom:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;}
.lb-title{font-family:'Playfair Display',serif;font-size:18px;font-style:italic;color:var(--warm);}
.lb-desc{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--muted);}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid rgba(42,26,26,.4);transition:background .15s;}
.lb-row:last-child{border-bottom:none;}
.lb-row:hover{background:rgba(201,168,76,.02);}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:26px;width:32px;color:var(--muted);}
.lb-rank.r1{color:var(--gold2);}
.lb-rank.r2{color:#c0c0c0;}
.lb-rank.r3{color:#cd7f32;}
.lb-info{flex:1;}
.lb-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;}
.lb-team{font-size:12px;color:var(--muted);margin-top:1px;}
.lb-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);}
.lb-val-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--muted);text-align:right;}
.lb-percentile{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--green);margin-top:2px;}
.lb-gcs-breakdown{font-size:11px;color:var(--muted);margin-top:3px;}
.empty-lb{text-align:center;padding:40px;color:var(--muted);font-size:13px;font-style:italic;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.grid-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <a href="index.html" class="back-link">← Back to Schedule</a>
    <div class="page-eyebrow">CEFL Chapter 2 Season 1</div>
    <div class="page-title">Leaderboard</div>
    <div class="page-sub">Season stats ranked by Game Contribution Score — updated as stats are approved</div>
  </div>

  <div class="controls">
    <span class="ctrl-label">Week:</span>
    <select class="ctrl-select" id="weekFilter" onchange="render()">
      <option value="all">All Weeks</option>
      <option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option>
      <option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option>
      <option value="7">Week 7</option><option value="8">Week 8</option><option value="9">Week 9</option>
      <option value="10">Week 10</option><option value="11">Week 11</option><option value="12">Week 12</option>
    </select>
    <span class="ctrl-label">Team:</span>
    <select class="ctrl-select" id="teamFilter" onchange="render()">
      <option value="all">All Teams</option>
      <option>Minnesota</option><option>Cincinnati</option><option>Oklahoma</option><option>Delaware</option>
      <option>Penn State</option><option>Georgia</option><option>Ole Miss</option><option>Texas A&M</option>
      <option>North Dakota State</option><option>LSU</option><option>Ohio State</option><option>TCU</option>
      <option>Kansas</option><option>UCLA</option><option>Michigan State</option><option>Oregon</option>
    </select>
    <div class="category-tabs">
      <button class="ctab active" onclick="setTab('gcs',this)">GCS</button>
      <button class="ctab" onclick="setTab('tds',this)">TDs</button>
      <button class="ctab" onclick="setTab('pass_tds',this)">Pass TDs</button>
      <button class="ctab" onclick="setTab('rush_tds',this)">Rush TDs</button>
      <button class="ctab" onclick="setTab('rec_tds',this)">Rec TDs</button>
      <button class="ctab" onclick="setTab('tackles',this)">Tackles</button>
      <button class="ctab" onclick="setTab('ints_caught',this)">INTs</button>
      <button class="ctab" onclick="setTab('pick6',this)">Pick 6s</button>
      <button class="ctab" onclick="setTab('kr_tds',this)">KR TDs</button>
      <button class="ctab" onclick="setTab('safeties',this)">Safeties</button>
    </div>
  </div>

  <div id="mainLB"></div>

  <div class="grid-2" id="subLBs"></div>
</div>

<script>
var DB='https://pefl-cefl-default-rtdb.firebaseio.com';
var LEAGUE='cefl_c2s1';
var _stats=[];
var currentTab='gcs';

function calcGCS(s){
  if(!s) return 0;
  return ((s.pass_tds||0)*6)+((s.rush_tds||0)*6)+((s.rec_tds||0)*6)+((s.def_tds||0)*6)+((s.pick6||0)*6)+((s.kr_tds||0)*6)+((s.receptions||0)*1)+((s.rushes||0)*0.5)+((s.pass_comp||0)*0.5)+((s.tackles||0)*1)+((s.ints_caught||0)*4)+((s.swats||0)*2)+((s.safeties||0)*4)+((s.ints_thrown||0)*-2);
}

function getApproved(){
  var wk=document.getElementById('weekFilter').value;
  var tm=document.getElementById('teamFilter').value;
  return _stats.filter(function(s){
    if(s.league!==LEAGUE||s.status!=='approved') return false;
    if(wk!=='all'&&String(s.week)!==wk) return false;
    if(tm!=='all'&&s.team!==tm) return false;
    return true;
  });
}

function aggregateByPlayer(stats,statFn){
  var map={};
  stats.forEach(function(s){
    var key=s.player_name+'|'+s.team;
    if(!map[key]) map[key]={name:s.player_name,team:s.team,games:0,val:0,gcs:0,pass_tds:0,rush_tds:0,rec_tds:0,def_tds:0,pick6:0,kr_tds:0,tackles:0,ints_caught:0,safeties:0,swats:0,receptions:0};
    map[key].games++;
    map[key].val+=statFn(s);
    map[key].gcs+=calcGCS(s);
    ['pass_tds','rush_tds','rec_tds','def_tds','pick6','kr_tds','tackles','ints_caught','safeties','swats','receptions'].forEach(function(f){map[key][f]+=(s[f]||0);});
  });
  return Object.values(map).sort(function(a,b){return b.val-a.val;});
}

function percentile(val,allVals){
  var sorted=allVals.slice().sort(function(a,b){return a-b;});
  var idx=sorted.lastIndexOf(val);
  return Math.round((idx/Math.max(sorted.length-1,1))*100);
}

function buildLB(players,title,desc,valLabel,showBreakdown){
  if(!players.length) return '<div class="leaderboard"><div class="lb-head"><div class="lb-title">'+title+'</div></div><div class="empty-lb">No stats yet</div></div>';
  var allVals=players.map(function(p){return p.val;});
  var rows=players.slice(0,15).map(function(p,i){
    var pct=percentile(p.val,allVals);
    var rankClass=i===0?'r1':i===1?'r2':i===2?'r3':'';
    var breakdown=showBreakdown?'<div class="lb-gcs-breakdown">'+(p.pass_tds?'PTD:'+p.pass_tds+' ':'')+(p.rush_tds?'RTD:'+p.rush_tds+' ':'')+(p.rec_tds?'RecTD:'+p.rec_tds+' ':'')+(p.pick6?'P6:'+p.pick6+' ':'')+(p.kr_tds?'KRTD:'+p.kr_tds+' ':'')+(p.tackles?'Tkl:'+p.tackles+' ':'')+(p.ints_caught?'INT:'+p.ints_caught+' ':'')+'</div>':'';
    return '<div class="lb-row"><div class="lb-rank '+rankClass+'">'+(i+1)+'</div>'
      +'<div class="lb-info"><div class="lb-name">'+p.name+'</div><div class="lb-team">'+p.team+' · '+p.games+' game'+(p.games!==1?'s':'')+'</div>'+breakdown+'</div>'
      +'<div style="text-align:right;"><div class="lb-val">'+Math.round(p.val*10)/10+'</div><div class="lb-val-label">'+valLabel+'</div>'+(pct>50?'<div class="lb-percentile">Top '+(100-pct)+'%</div>':'')+'</div>'
      +'</div>';
  }).join('');
  return '<div class="leaderboard"><div class="lb-head"><div><div class="lb-title">'+title+'</div><div class="lb-desc">'+desc+'</div></div></div>'+rows+'</div>';
}

function setTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.ctab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function render(){
  var approved=getApproved();
  var statFns={
    gcs:calcGCS,
    tds:function(s){return (s.pass_tds||0)+(s.rush_tds||0)+(s.rec_tds||0)+(s.def_tds||0)+(s.pick6||0)+(s.kr_tds||0);},
    pass_tds:function(s){return s.pass_tds||0;},
    rush_tds:function(s){return s.rush_tds||0;},
    rec_tds:function(s){return s.rec_tds||0;},
    tackles:function(s){return s.tackles||0;},
    ints_caught:function(s){return s.ints_caught||0;},
    pick6:function(s){return s.pick6||0;},
    kr_tds:function(s){return s.kr_tds||0;},
    safeties:function(s){return s.safeties||0;},
  };
  var labels={gcs:'GCS',tds:'TDs',pass_tds:'Pass TDs',rush_tds:'Rush TDs',rec_tds:'Rec TDs',tackles:'Tackles',ints_caught:'INTs',pick6:'Pick 6s',kr_tds:'KR TDs',safeties:'Safeties'};
  var descs={gcs:'Game Contribution Score — full fantasy scoring formula',tds:'Total touchdowns (all types)',pass_tds:'Passing touchdowns',rush_tds:'Rushing touchdowns',rec_tds:'Receiving touchdowns',tackles:'Total tackles',ints_caught:'Interceptions caught',pick6:'Pick 6 interceptions returned for TD',kr_tds:'Kick return touchdowns',safeties:'Safeties scored'};
  var players=aggregateByPlayer(approved,statFns[currentTab]);
  document.getElementById('mainLB').innerHTML=buildLB(players,labels[currentTab]+' Leaders',descs[currentTab],labels[currentTab],currentTab==='gcs');

  // Sub leaderboards always shown at bottom
  var subCategories=[
    {tab:'pass_tds',label:'Pass TDs',fn:function(s){return s.pass_tds||0;}},
    {tab:'rush_tds',label:'Rush TDs',fn:function(s){return s.rush_tds||0;}},
    {tab:'rec_tds',label:'Rec TDs',fn:function(s){return s.rec_tds||0;}},
    {tab:'tackles',label:'Tackles',fn:function(s){return s.tackles||0;}},
    {tab:'ints_caught',label:'INTs',fn:function(s){return s.ints_caught||0;}},
    {tab:'pick6',label:'Pick 6s',fn:function(s){return s.pick6||0;}},
    {tab:'kr_tds',label:'KR TDs',fn:function(s){return s.kr_tds||0;}},
    {tab:'safeties',label:'Safeties',fn:function(s){return s.safeties||0;}},
  ].filter(function(c){return c.tab!==currentTab;});
  document.getElementById('subLBs').innerHTML=subCategories.slice(0,6).map(function(c){
    var ps=aggregateByPlayer(approved,c.fn).slice(0,5);
    return buildLB(ps,c.label+' Leaders','',c.label,false);
  }).join('');
}

async function fetchAndRender(){
  try{
    var res=await fetch(DB+'/stats.json');
    var json=await res.json();
    _stats=json?Object.values(json):[];
  }catch(e){_stats=[];}
  render();
}

fetchAndRender();
</script>
</body>
</html>
